<head>
    <title>dice</title>
    <link rel="icon" href="../images/icon.png">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <table style="width: 100%;"><tr>
            <td>
                <h1>Weighted Dice</h1>
            </td>
            <td style="text-align: right;">
                <span class = "nowrap">
                    email:
                    <input type="text" placeholder="your@email.com" />
                </span>
                &nbsp;&nbsp;&nbsp;

                <span class="nowrap">
                    password:
                    <input type="password" placeholder="password" />
                </span>
                &nbsp;&nbsp;&nbsp;

                <span class="nowrap">
                    <button type="submit">Login</button>
                    <button type="submit">Create</button>
                </span>
                <br>
                Logged in as [placeholder]
            </td>       
        </tr></table>
    </header>

    <aside class = "notifpanel">
        notification panel
        <br>
        <br>
        websocket will send updates here 
        (your die was beaten, new high score, etc)
    </aside>

    <main>
        <div class= "centerdiv">
            <button class = "bigbutton">Edit Die</button>
            &nbsp;&nbsp;&nbsp;
            <button class= "bigbutton">Challenge</button>
        </div>
        <br><br><br>

        <!--pain and suffering, generally-->
        <div class = "centerdiv">
            <table style = "width: 50%;"><tr>
                <td style = "width: 50%;" class = "centerdiv">
                    <table class = "center" style = "margin: auto;">
                        <tr>
                            <td></td>
                            <td>
                                <img src = "../images/dice_faces/1.png" class = "fill">
                            </td>
                            <td></td>
                        </tr>
                        <tr>
                            <td>
                                <img src = "../images/dice_faces/3.png" class = "fill">
                            </td>
                            <td>
                                <img src = "../images/dice_faces/2.png" class = "fill">
                            </td>
                            <td>
                                <img src = "../images/dice_faces/4.png" class = "fill">
                            </td>
                        </tr>
                        <tr>
                            <td></td>
                            <td>
                                <img src = "../images/dice_faces/6.png" class = "fill">
                            </td>
                            <td></td>
                        </tr>
                        <tr>
                            <td></td>
                            <td>
                                <img src = "../images/dice_faces/5.png" class = "fill">
                            </td>
                            <td></td>
                        </tr>
                    </table>
                </td>
                <td>
                    <div class="scene">
                        <div class="cube center">
                            <div class="cface cf-front">front</div>
                            <div class="cface cf-back">back</div>
                            <div class="cface cf-right">right</div>
                            <div class="cface cf-left">left</div>
                            <div class="cface cf-top">top</div>
                            <div class="cface cf-bottom">bottom</div>
                        </div>
                    </div>    
                </td>
            </tr></table>
        </div>

    </main>

    <footer style="position: fixed; bottom: 0; left: 0; width: 100%;">
        <table style="width: 100%;"><tr>
            <td style="width: 50%;">
                Author(s): Brayden Dickerson
                <br>
                <a href="https://github.com/Brayden-D/startup260/tree/main">Github</a> 
            </td>
            <td style="text-align: right; width: 50%;">
                <a href="leaderboard.html">Leaderboard</a>
                &nbsp;
                <a href="about.html">About</a>
                &nbsp;
            </td>       
        </tr></table>
    </footer>

    <script>
        const cube = document.querySelector('.cube');
        const faces = [
            'show-front',
            'show-right',
            'show-back',
            'show-left',
            'show-top',
            'show-bottom'
        ];

        let i = 0;
        setInterval(() => {
            cube.className = 'cube ' + faces[i % faces.length];
            i++;
        }, 1500);
    </script>


</body>
