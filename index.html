<head>
    <title>dice</title>
    <link rel="icon" href="../images/icon.png">
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class = "background">
    <header class = "header">
        <table style="width: 100%;"><tr>
            <td>
                <h1 style = "padding-left: 20px; padding-top: 10px;" class = "nowrap">
                    Weighted Dice
                </h1>
            </td>
            <td style="text-align: right; padding-right: 10px;">
                <span class = "nowrap">
                    Username:
                    <input type="text" placeholder="username" />
                </span>
                &nbsp;&nbsp;

                <span class="nowrap">
                    Password:
                    <input type="password" placeholder="password" />
                </span>

                <span class="nowrap">
                    <button type="submit" class = "smallbutton">Login</button>
                    <button type="submit" class = "smallbutton">Create</button>
                </span>
                <div style = "height: 5px;"></div>
                Logged in as [placeholder]
            </td>       
        </tr></table>
    </header>

    <aside class = "notifpanel">
        <div class = "centerdiv" 
            style = "background-color: tan;
            font-family: Roboto;
            height: 25px;
            line-height: 25px;" >Notifications</div>    
        <div style="height:10px"></div>
        <div class = "notification">Placeholder notif 1 asdfasdfs</div>
        <div style="height:10px"></div>
        <div class = "notification">Placeholder notif 2 asddasfd</div>
    </aside>

    <main>
        <br>
        <div class= "centerdiv">
            <button class = "bigbutton"><b>Edit Die</b></button>
            &nbsp;&nbsp;&nbsp;
            <button class= "bigbutton"><b>Challenge</b></button>
        </div>
        <br><br><br>

        <!--pain and suffering, generally-->
        <div class = "centerdiv">
            <table style = "width: 62%;"><tr>
                <td style = "width: 50%;" class = "centerdiv">
                    <table class = "center" style = "margin: auto;">
                        <tr>
                            <td></td>
                            <td style="background-color: purple;">
                                <img src = "../images/dice_faces/1.png" class = "fill">
                            </td>
                            <td></td>
                        </tr>
                        <tr>
                            <td style="background-color: green;">
                                <img src = "../images/dice_faces/3.png" class = "fill">
                            </td>
                            <td style="background-color: red;">
                                <img src = "../images/dice_faces/2.png" class = "fill">
                            </td>
                            <td style="background-color: yellow;">
                                <img src = "../images/dice_faces/4.png" class = "fill">
                            </td>
                        </tr>
                        <tr>
                            <td></td>
                            <td style="background-color: orange">
                                <img src = "../images/dice_faces/6.png" class = "fill">
                            </td>
                            <td></td>
                        </tr>
                        <tr>
                            <td></td>
                            <td style="background-color: blue;">
                                <img src = "../images/dice_faces/5.png" class = "fill">
                            </td>
                            <td></td>
                        </tr>
                    </table>
                </td>
                <td>
                    <div class="scene">
                        <div class="cube center">
                            <div class="cface cf-front">
                                <img src = "../images/dice_faces/2.png" class = "fill">
                            </div>
                            <div class="cface cf-back">
                                <img src = "../images/dice_faces/5.png" class = "fill">
                            </div>
                            <div class="cface cf-right">
                                <img src = "../images/dice_faces/4.png" class = "fill">
                            </div>
                            <div class="cface cf-left">
                                <img src = "../images/dice_faces/3.png" class = "fill">
                            </div>
                            <div class="cface cf-top">
                                <img src = "../images/dice_faces/1.png" class = "fill">
                            </div>
                            <div class="cface cf-bottom">
                                <img src = "../images/dice_faces/6.png" class = "fill">
                            </div>
                        </div>
                    </div>    
                </td>
            </tr></table>
        </div>

    </main>

    <footer class = "footer">
        <table style="width: 100%;"><tr>
            <td style="width: 50%;">
                Author(s): Brayden Dickerson
                <br>
                <img src = "../images/github.png" style = height:15px>
                <a href="https://github.com/Brayden-D/startup260/tree/main">Github</a> 
            </td>
            <td style="text-align: right; width: 50%;">
                <a href="leaderboard.html">Leaderboard</a>
                &nbsp;
                <a href="about.html">About</a>
                &nbsp;&nbsp;&nbsp;
            </td>       
        </tr></table>
    </footer>

    <script>
        const cube = document.querySelector('.cube');
        const faces = [
            'show-right',
            'show-back',
            'show-left',
            'show-top',
            'show-bottom',
            'show-front'
        ];

        let i = 0;
        setInterval(() => {
            cube.className = 'cube ' + faces[i % faces.length];
            i++;
        }, 2000);
    </script>


</body>
